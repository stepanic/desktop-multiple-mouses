[package]
name = "multi-mouse"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mm-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
rusb = { version = "0.9", features = ["vendored"] }
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_Registry"] }
