name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
      - run: cargo build --release -p multi-mouse
      - uses: actions/upload-artifact@v4
        with:
          name: multi-mouse-windows
          path: target/release/multi-mouse.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: cargo test --workspace
      - run: |
          cargo build --release -p multi-mouse-agent --target aarch64-apple-darwin
          cargo build --release -p multi-mouse-agent --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/multi-mouse-agent \
            target/aarch64-apple-darwin/release/multi-mouse-agent \
            target/x86_64-apple-darwin/release/multi-mouse-agent
          codesign --force --sign - dist/multi-mouse-agent
      - uses: actions/upload-artifact@v4
        with:
          name: multi-mouse-agent-macos
          path: dist/multi-mouse-agent

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/multi-mouse-windows/multi-mouse.exe
            artifacts/multi-mouse-agent-macos/multi-mouse-agent
